[project]
name = "pdftext"
version = "0.1.0"
description = "Turn digital PDFs into layout-aware XML."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pdfplumber>=0.11.10,<0.12",
    "pdfminer.six>=20251107",
    "pypdfium2",
]

[project.scripts]
pdftext = "pdftext.cli:main"

[dependency-groups]
dev = [
    "lxml",
    "mypy",
    "pip-audit",
    "pytest",
    "pytest-cov",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pdftext"]

[tool.ruff]
line-length = 100
extend-exclude = ["docs"]
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
